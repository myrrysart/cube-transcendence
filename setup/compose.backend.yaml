# Optional host-development overrides; the default stack needs only compose.yaml.
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  api:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      ENABLE_DEV_SESSION: ${ENABLE_DEV_SESSION:-false}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443},http://localhost:5173,http://127.0.0.1:5173
